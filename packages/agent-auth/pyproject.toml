[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-auth"
version = "0.1.0"
description = "Shared authentication package for AgentPlatform"
requires-python = ">=3.12"

dependencies = [
    "python-jose[cryptography]>=3.5",
    "fastapi>=0.115",
    "bcrypt>=4.1.2",
]

[tool.setuptools.packages.find]
where = ["src"]