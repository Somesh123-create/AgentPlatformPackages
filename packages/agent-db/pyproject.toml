[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-db"
version = "0.1.0"
description = "Shared database infrastructure for AgentPlatform"
requires-python = ">=3.12"

dependencies = [
    "sqlalchemy>=2.0",
    "asyncpg>=0.29"
]

[tool.setuptools.packages.find]
where = ["src"]